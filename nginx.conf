events {
    worker_connections 4096;
}

http {
    limit_req_zone $binary_remote_addr zone=classification_api:10m rate=50r/s;
    resolver 127.0.0.11 valid=5s ipv6=off;

    upstream classifier_api {
        zone classifier_api 64k;
        server web:8000 resolve;
    }

    server {
        listen 80;
        server_name localhost;

        client_max_body_size 256k;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;

        location /api/classify/ {
            limit_req zone=classification_api burst=100 nodelay;
            limit_req_status 429;
            proxy_pass http://classifier_api;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        location / {
            proxy_pass http://classifier_api;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Host $host;
            proxy_redirect off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
    }
}
